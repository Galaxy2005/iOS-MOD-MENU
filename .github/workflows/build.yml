name: Build iOS Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Geode Mod
      uses: geode-sdk/build-geode-mod@main
      with:
        sdk: v5.11.2
        target: iOS
