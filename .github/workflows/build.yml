name: Build iOS Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Geode CLI
      uses: geode-sdk/install-geode-cli@v1

    - name: Set up Geode SDK
      uses: geode-sdk/setup-geode-sdk@v1
      with:
        sdk: v5.11.2

    - name: Build Mod
      run: |
        geode package build --platform iOS
