name: Build iOS Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Geode Binaries
        run: geode sdk install-binaries

      - name: Build Geode Mod for iOS
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: latest
          configure-args: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DGEODE_TARGET_PLATFORM=iOS

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-mod-menu
          path: ${{ steps.build.outputs.build-output }}
