name: Build Geode iOS Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          combine: true

      - name: Upload Geode package
        uses: actions/upload-artifact@v4
        with:
          name: ios-geode-mod
          path: build-output/*.geode
          if-no-files-found: error
